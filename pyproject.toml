[project]
name = "pyfa"
version = "2.0.1"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "sqlalchemy==1.4.50",
    "python-dateutil",
    "requests",
    "logbook",
    "packaging",
    "roman",
    "beautifulsoup4",
    "pyyaml",
    "python-jose",
    "requests-cache",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eos", "utils"]
