[project]
name = "pyfa"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4==4.12.2",
    "cryptography==42.0.4",
    "logbook==1.7.0.post0",
    "markdown2==2.4.11",
    "matplotlib==3.8.2",
    "numpy==1.26.2",
    "packaging==23.2",
    "python-dateutil==2.8.2",
    "python-jose==3.3.0",
    "pyyaml==6.0.1",
    "requests==2.31.0",
    "requests-cache==1.1.1",
    "roman==4.1",
    "sqlalchemy==1.4.50",
    "wxpython==4.2.4",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["eos*", "service*", "graphs*", "gui*", "utils*"]
